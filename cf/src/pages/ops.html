<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Operations Hub · Twins Locs Arena</title>
<link rel="icon" href="/logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="/icons/icon-180.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/brand.css">
<style nonce="__NONCE__">
.hub{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
.side{background:var(--green-deep);color:var(--on-green);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100dvh;overflow:auto}
:root[data-theme="dark"] .side{background:#0E2214}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:#0E2214}}
.side .brand{font-family:var(--f-display);font-size:1.05rem;display:flex;align-items:center;gap:8px}
.side .brand small{font-family:var(--f-body);font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.who{background:rgba(248,232,200,.1);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.who b{font-size:.95rem}
.who span{font-size:.76rem;color:#BFD2B4}
.navlist{display:grid;gap:2px}
.navlist button{background:none;border:0;color:#CFE0C4;text-align:left;padding:.55em .75em;border-radius:8px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:.92rem;width:100%}
.navlist button:hover{background:rgba(248,232,200,.1);color:var(--on-green);transform:translateX(2px)}
.navlist button[aria-current="page"]{background:var(--cream);color:var(--green-deep)}
.navlist .n{margin-left:auto;font-size:.72rem;background:var(--gold);color:#23200C;border-radius:999px;padding:0 .5em;font-weight:700}
.side-foot{margin-top:auto;display:grid;gap:8px;font-size:.78rem;color:#A9BC9D}
.side-foot .btn{border-color:rgba(248,232,200,.5);color:var(--on-green);background:transparent}
.side-foot .btn:hover{background:rgba(248,232,200,.12)}
.main{padding:clamp(16px,2.6vw,30px);display:grid;gap:18px;align-content:start;min-width:0}
.top{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.top h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.topbar{display:none}
.dept-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.secret-box{background:var(--gold-soft);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.photo{margin:0;background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease)}
.photo:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.photo img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--surface-2)}
.photo figcaption{padding:12px 14px 14px;display:grid;gap:6px}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.agent{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start;cursor:pointer;border:1.5px solid var(--line);text-align:left;color:inherit;font:inherit;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease)}
.agent:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.agent:hover{border-color:var(--gold)}
.agent h3{font-size:1.1rem}
.agent .skills{display:flex;flex-wrap:wrap;gap:6px}
.agent .skills span{font-size:.72rem;background:var(--bg-2);border-radius:999px;padding:.15em .6em;color:var(--ink-2)}
.answer{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:14px;font-size:.95rem;line-height:1.6;max-height:50vh;overflow:auto}
.ledger-line{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:.88rem;padding:4px 0}
.ledger-line .acc{color:var(--ink-2)}
.pl-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.pl-row.total{font-weight:700;border-bottom:0;border-top:1.5px solid var(--line-strong);padding-top:10px}
.check{display:flex;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.check .mark.ok{background:var(--ok-bg);color:var(--ok)}
.check .mark.no{background:var(--warn-bg);color:var(--warn)}
@media (max-width:860px){
  .hub{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;height:56px;padding:0 12px 0 16px;background:var(--green-deep);color:var(--on-green)}
  .topbar .brand{font-family:var(--f-display);font-size:1rem;margin-right:auto}
  .topbar select{background:var(--cream);color:var(--green-deep);border:0;border-radius:999px;padding:.4em 2em .4em .9em;font-weight:700;font-size:.86rem;appearance:none}
  .topbar button{background:none;border:1.5px solid rgba(248,232,200,.35);color:var(--on-green);border-radius:999px;height:34px;padding:0 10px;font-weight:600;font-size:.82rem;cursor:pointer}
  .main{padding:14px 12px 30px}
  .t-cards thead{display:none}
  .t-cards tr{display:grid;gap:4px;padding:12px;border-bottom:1px solid var(--line)}
  .t-cards td{display:block;padding:0;border:0}
  .t-cards td.r{text-align:left}
  .t-cards td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:.8rem}
}
</style>
</head>
<body>
<div class="hub">
  <aside class="side">
    <span class="brand"><img src="/logo.webp" alt="" width="30" height="30" style="border-radius:7px"> Twins Locs Arena <small>Hub</small></span>
    <div class="who" id="who"></div>
    <nav class="navlist" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <p id="deptBlurb"></p>
      <a class="btn ghost sm" href="/" target="_blank" rel="noopener">View the shop</a>
      <button class="btn ghost sm" data-act="signout">Sign out</button>
    </div>
  </aside>

  <header class="topbar">
    <span class="brand">Twins Locs Arena</span>
    <select id="navMobile" aria-label="Section"></select>
    <button data-act="signout">Out</button>
  </header>

  <main class="main" id="main"><p class="empty">Loading your hub…</p></main>
</div>

<dialog id="dlg"><form class="dlg-main" id="dlgForm" novalidate><div class="grab"></div><div id="dlgBody"></div></form></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script nonce="__NONCE__">
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { me: null, currency: "KSh", section: "today", data: {}, departments: {} };

/* ---------------------------------------------------------------- plumbing */
async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(`/api/${path}`, {
    method,
    headers: { "Content-Type": "application/json", "X-TLA-App": "1" },
    credentials: "same-origin",
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { location.href = "/staff"; throw new Error("Signed out"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Something went wrong (${res.status}).`);
  return data;
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 4000); }
async function busy(btn, label, fn) {
  const old = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = label; }
  try { return await fn(); } finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}
const money = (cents) => `${S.currency} ${(Math.round(cents || 0) / 100).toLocaleString("en-US", { maximumFractionDigits: 2 })}`;
const shillings = (cents) => Math.round((cents || 0) / 100);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => (d ? new Date(`${d}T00:00:00`).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) : "");
const ago = (t) => {
  if (!t) return "";
  const mins = Math.round((Date.now() - Date.parse(t.replace(" ", "T") + "Z")) / 6e4);
  if (mins < 2) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  if (h < 24) return `${h} h ago`;
  return `${Math.round(h / 24)} d ago`;
};
const can = (cap) => (S.me?.caps || []).includes(cap);
const tag = (status) => `<span class="tag s-${esc(status)}">${esc(String(status).replace("_", " "))}</span>`;
const ICONS = {
  today: '<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>', calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  clients: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.3 6-5.3s5.4 1.9 6 5.3"/><circle cx="17" cy="9" r="2.4"/>',
  orders: '<path d="M3.5 7.5 12 3.5l8.5 4-8.5 4z"/><path d="M3.5 7.5v9l8.5 4 8.5-4v-9"/>', stock: '<path d="M4 7h16v13H4z"/><path d="M4 7l2-3h12l2 3M9 11h6"/>',
  tags: '<path d="M3.5 12.5V4h8.5l9 9-8.5 8.5z"/><circle cx="8" cy="8.5" r="1.5"/>', ledger: '<path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>', check: '<path d="M4 12l5 5L20 6"/>',
  chart: '<path d="M4 19V5M20 19H4M8 16V9M12 16v-4M16 16v-7"/>', staff: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.6-6 7-6s6.2 2 7 6"/>',
  tasks: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"/>',
  offer: '<path d="M20.5 12 12 20.5 3.5 12 12 3.5z"/><circle cx="12" cy="12" r="2.5"/>', folder: '<path d="M3 7h6l2 2h10v10H3z"/>',
  agent: '<rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01M9.5 16h5"/>',
  visitors: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.3 6-5.3s5.4 1.9 6 5.3"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.6c2.4.2 4 1.9 4.5 4.6"/>',
  photo: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.8"/><path d="M4 17l5-4 3 2.5L16 11l4 4"/>',
  settings: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.4 8.4-8 9-4.6-.6-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
};
const icon = (k) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ICONS.today}</svg>`;

/* ---------------------------------------------------------------- dialog */
function openDialog(title, bodyHtml, { submit = "Save", onSubmit, wide = false } = {}) {
  $("#dlgBody").innerHTML = `<div class="spread"><h2>${esc(title)}</h2><button type="button" class="x" data-act="close-dlg" aria-label="Close">×</button></div>${bodyHtml}
    <p class="err" id="dlgErr" hidden></p>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="btn ghost" data-act="close-dlg">Cancel</button>
      ${onSubmit ? `<button class="btn" type="submit">${esc(submit)}</button>` : ""}
    </div>`;
  $("#dlg").style.maxWidth = wide ? "860px" : "";
  $("#dlgForm").onsubmit = async (e) => {
    e.preventDefault();
    if (!onSubmit) return;
    const err = $("#dlgErr");
    err.hidden = true;
    try {
      await busy(e.submitter, "Saving…", () => onSubmit(new FormData(e.target)));
      $("#dlg").close();
    } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
  $("#dlg").showModal();
}
const val = (fd, k) => String(fd.get(k) || "").trim();
const fileToDataUrl = (file, max = 1100) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = rej;
  r.onload = () => {
    if (!/^image\//.test(file.type)) return res(r.result); // PDFs go as-is
    const im = new Image();
    im.onerror = rej;
    im.onload = () => {
      const scale = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
});

/* ---------------------------------------------------------------- shell */
async function boot() {
  const me = await api("staff/me");
  if (!me.me) { location.href = "/staff"; return; }
  S.me = me.me; S.currency = me.currency || "KSh"; S.departments = me.departments || {};
  const dept = S.departments[S.me.department] || {};
  $("#who").innerHTML = `<b>${esc(S.me.name)}</b><span>${esc(S.me.title || S.me.roleName)}</span>
    <span><span class="dept-dot" style="background:${esc(dept.colour || "#D39A17")}"></span> ${esc(S.me.departmentName)}</span>`;
  $("#deptBlurb").textContent = dept.blurb || "";
  const sections = S.me.sections || [];
  $("#nav").innerHTML = sections.map((s) => `<button data-section="${s.key}">${icon(s.icon)}<span>${esc(s.label)}</span><span class="n" data-count="${s.key}" hidden></span></button>`).join("");
  $("#navMobile").innerHTML = sections.map((s) => `<option value="${s.key}">${esc(s.label)}</option>`).join("");
  const wanted = location.hash.slice(1);
  go(sections.some((s) => s.key === wanted) ? wanted : "today");
  if (S.me.mustChange) promptPasswordChange();
  else if (!S.me.termsAccepted) promptTerms();
}

function go(section) {
  S.section = section;
  location.hash = section;
  for (const b of document.querySelectorAll("#nav button")) b.toggleAttribute("aria-current", b.dataset.section === section);
  document.querySelectorAll("#nav button").forEach((b) => (b.dataset.section === section ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
  $("#navMobile").value = section;
  render(section);
}

const header = (title, actions = "") => `<div class="top"><div><span class="eyebrow">${fmtDate(today())}</span><h1>${esc(title)}</h1></div><div class="row">${actions}</div></div>`;

async function render(section) {
  const main = $("#main");
  main.innerHTML = `<p class="empty">Loading…</p>`;
  try {
    await VIEWS[section]?.(main);
  } catch (e) {
    main.innerHTML = `${header("Something went wrong")}<div class="panel"><p class="err">${esc(e.message)}</p><div><button class="btn sm" data-act="reload">Try again</button></div></div>`;
  }
}

/* ---------------------------------------------------------------- views */
const VIEWS = {};

VIEWS.today = async (main) => {
  const d = await api("ops/dashboard");
  S.data.dashboard = d;
  const badge = (key, n) => { const el = document.querySelector(`[data-count="${key}"]`); if (el) { el.textContent = n; el.hidden = !n; } };
  badge("bookings", d.counts.pending); badge("orders", d.counts.openOrders);
  badge("inventory", d.counts.low); badge("approvals", d.counts.approvals);
  main.innerHTML = header(`Hello, ${S.me.name.split(" ")[0]}`, `<button class="btn ghost sm" data-act="reload">Refresh</button>`) + `
    <div class="kpis">
      <div class="kpi"><span class="l">Sessions today</span><span class="v num">${d.todays.length}</span><span class="s">${d.chairHoursFree} chair-hours free</span></div>
      <div class="kpi"><span class="l">To confirm</span><span class="v num">${d.counts.pending}</span><span class="s">Call the client and take the deposit</span></div>
      <div class="kpi"><span class="l">Orders to pack</span><span class="v num">${d.counts.openOrders}</span><span class="s">Shop orders waiting</span></div>
      ${d.revenue.visible ? `<div class="kpi"><span class="l">Last 7 days</span><span class="v num">${money(d.revenue.week)}</span><span class="s">Sessions ${money(d.revenue.salon)} · shop ${money(d.revenue.shop)}</span></div>`
        : `<div class="kpi"><span class="l">Low stock</span><span class="v num">${d.counts.low}</span><span class="s">Items at or below reorder level</span></div>`}
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h3>In the chair today</h3>${can("bookings.view") ? `<button class="link-btn" data-section="bookings">All bookings</button>` : ""}</div>
        <div class="list">${d.todays.map((b) => `<div class="li">
          <div class="when">${esc(b.time)}<small>${esc(b.assignee_name || "unassigned")}</small></div>
          <div style="min-width:0"><div class="who">${esc(b.name)} · ${esc(b.service)}</div><div class="what">${esc(b.notes || "No notes")} · ${esc(b.phone)}</div></div>
          ${tag(b.status)}</div>`).join("") || `<p class="empty">No sessions booked today.</p>`}</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>${S.me.department === "employee" ? "Your next sessions" : "Your tasks"}</h3>${can("tasks.view") ? `<button class="link-btn" data-section="tasks">All tasks</button>` : ""}</div>
        <div class="list">${(S.me.department === "employee" && d.mine.length
          ? d.mine.map((b) => `<div class="li"><div class="when">${esc(b.time)}<small>${fmtDate(b.date)}</small></div><div><div class="who">${esc(b.service)}</div><div class="what">${esc(b.name)}</div></div>${tag(b.status)}</div>`)
          : d.tasks.map((t) => `<div class="li"><div class="when">${t.due_on ? fmtDate(t.due_on) : "-"}</div><div><div class="who">${esc(t.title)}</div><div class="what">${esc(t.detail || "")}</div></div>${tag(t.status)}</div>`)
        ).join("") || `<p class="empty">Nothing waiting for you.</p>`}</div>
      </div>
    </div>`;
};

VIEWS.bookings = async (main) => {
  const filter = S.data.bookingFilter || "upcoming";
  const [{ bookings }, staffList] = await Promise.all([
    api(`ops/bookings?filter=${encodeURIComponent(filter)}`),
    can("bookings.assign") ? api("staff/employees").catch(() => ({ employees: [] })) : Promise.resolve({ employees: [] }),
  ]);
  const people = (staffList.employees || []).filter((e) => e.status === "active");
  main.innerHTML = header("Bookings", `${can("bookings.edit") ? `<button class="btn gold sm" data-act="new-booking">Add booking</button>` : ""}<button class="btn ghost sm" data-act="reload">Refresh</button>`) + `
    <div class="chips scroll">${["upcoming", "pending", "confirmed", "done", "cancelled", "all"].map((f) => `<button class="chip" data-bfilter="${f}" aria-pressed="${f === filter}">${f[0].toUpperCase() + f.slice(1)}</button>`).join("")}</div>
    <div class="tbl-wrap"><table class="t-cards"><thead><tr><th>Ref</th><th>When</th><th>Client</th><th>Service</th><th class="r">Price</th><th class="r">Deposit</th><th>Who</th><th>Status</th></tr></thead><tbody>
    ${bookings.map((b) => `<tr>
      <td class="mono" data-l="Ref">${esc(b.id)}</td>
      <td class="num" data-l="When">${b.date === today() ? "Today" : fmtDate(b.date)}<span class="sub">${esc(b.time)}</span></td>
      <td data-l="Client">${esc(b.name)}<span class="sub"><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a></span></td>
      <td data-l="Service">${esc(b.service)}<span class="sub">${esc(b.notes || "")}</span></td>
      <td class="r num" data-l="Price">${money(b.price_cents)}</td>
      <td class="r num" data-l="Deposit">${money(b.deposit_cents)}</td>
      <td data-l="Who">${can("bookings.assign")
        ? `<select class="pill" data-assign="${esc(b.id)}"><option value="">Unassigned</option>${people.map((p) => `<option value="${esc(p.id)}" ${p.id === b.assigned_to ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>`
        : esc(b.assignee_name || "-")}</td>
      <td data-l="Status">${can("bookings.edit")
        ? `<select class="pill s-${esc(b.status)}" data-status="booking" data-id="${esc(b.id)}">${["pending", "confirmed", "done", "cancelled", "no_show"].map((s) => `<option value="${s}" ${s === b.status ? "selected" : ""}>${s.replace("_", " ")}</option>`).join("")}</select>`
        : tag(b.status)}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">No bookings match this filter.</td></tr>`}
    </tbody></table></div>
    <p class="hint">Marking a session <strong>done</strong> records the money straight into the books.</p>`;
};

VIEWS.clients = async (main) => {

/* ---------------------------------------------------------------- helpers */
function addDays(date, n) { return new Date(Date.parse(`${date}T00:00:00Z`) + n * 86400000).toISOString().slice(0, 10); }
function dateRange(from, to) {
  return `<div class="inline-form">
    <div class="field"><label for="rFrom">From</label><input id="rFrom" type="date" value="${from}"></div>
    <div class="field"><label for="rTo">To</label><input id="rTo" type="date" value="${to}"></div>
    <button class="btn sm" data-act="apply-range">Show</button>
    <button class="btn ghost sm" data-act="range-month">This month</button>
  </div>`;
}
function barChart(rows, { plain = false } = {}) {
  const W = 640, H = 220, L = 54, R = 10, T = 18, B = 28;
  const n = Math.max(rows.length, 1);
  const max = Math.max(...rows.map((r) => r.total), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))) / 2 || 1;
  const niceMax = Math.ceil(max / step) * step;
  const y = (v) => T + (H - T - B) * (1 - v / niceMax);
  const bw = (W - L - R) / n;
  const short = (v) => (plain ? String(Math.round(v)) : v >= 100000 ? `${Math.round(v / 100000)}k` : String(Math.round(v / 100)));
  let g = "";
  for (const f of [0, 0.5, 1]) {
    const v = niceMax * f;
    g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`;
  }
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * 0.2, w = bw * 0.6, h = H - T - B - (y(r.total) - T);
    g += `<rect class="bar${i === rows.length - 1 ? " today" : ""}" x="${x}" y="${y(r.total)}" width="${Math.max(w, 2)}" height="${Math.max(h, 0)}" rx="3"/>`;
    if (n <= 16) g += `<text x="${x + w / 2}" y="${H - 9}" text-anchor="middle">${new Date(`${r.date}T00:00:00`).getDate()}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart">${g}</svg>`;
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act],[data-section],[data-bfilter]");
  if (!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  try {
    if (t.dataset.section) return go(t.dataset.section);
    if (t.dataset.bfilter) { S.data.bookingFilter = t.dataset.bfilter; return render("bookings"); }

    switch (act) {
      case "reload": return render(S.section);
      case "close-dlg": return $("#dlg").close();
      case "signout": await api("staff/logout", { method: "POST" }); location.href = "/staff"; return;
      case "apply-range": S.data.from = $("#rFrom").value; S.data.to = $("#rTo").value; return render(S.section);
      case "range-month": { const d = new Date(); S.data.from = `${d.toISOString().slice(0, 8)}01`; S.data.to = today(); return render(S.section); }

        return openDialog(id ? "Edit service" : "Add service", `
          <div class="field"><label>Name</label><input name="name" value="${esc(s.name || "")}" required></div>
          <div class="row2"><div class="field"><label>Category</label><select name="cat">${cat.categories.service.map((c) => `<option ${c === s.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
          <div class="field"><label>Price from (shillings)</label><input name="price" type="number" value="${shillings(s.price_cents)}" required></div></div>
          <div class="row2"><div class="field"><label>Time needed</label><input name="dur" value="${esc(s.dur || "")}" placeholder="2-3 hrs"></div>
          <div class="field"><label>Come back in</label><input name="care" value="${esc(s.care || "")}" placeholder="Every 4-6 wks"></div></div>
          <div class="field"><label>Description</label><textarea name="descr">${esc(s.descr || "")}</textarea></div>
          <div class="field"><label>Photo of this service</label><input name="photo" type="file" accept="image/*">
            ${s.img ? `<label class="hint"><input type="checkbox" name="removeImg"> Remove the photo it has now</label>` : ""}</div>`,
          { submit: "Save service", onSubmit: async (fd) => {
            const file = fd.get("photo");
            const body = { id, name: val(fd, "name"), cat: val(fd, "cat"), price: Number(val(fd, "price")), dur: val(fd, "dur"), care: val(fd, "care"), descr: val(fd, "descr") };
            if (file && file.size) body.imgData = await fileToDataUrl(file, 1200);
            if (fd.get("removeImg") === "on") body.removeImg = true;
            await api("ops/catalog/service", { method: "PUT", body });
            toast("Saved."); S.data.catalog = null; render("catalog");
          } });
      }

      case "new-expense": return openDialog("Record an expense", `
        <div class="row2"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div>
        <div class="field"><label>Amount (shillings)</label><input name="amount" type="number" min="1" required></div></div>
        <div class="row2"><div class="field"><label>What for</label><input name="category" placeholder="Rent, supplies, transport…" required></div>
        <div class="field"><label>Paid to</label><input name="payee"></div></div>
        <div class="row2"><div class="field"><label>How</label><select name="method"><option value="cash">Cash</option><option value="mpesa">M-Pesa</option><option value="bank">Bank</option><option value="card">Card</option></select></div>
        <div class="field"><label>Reference</label><input name="ref"></div></div>
        <div class="field"><label>Receipt photo</label><input name="receipt" type="file" accept="image/*,application/pdf"></div>
        <div class="field"><label>Note</label><textarea name="note"></textarea></div>`,
        { submit: "Record expense", onSubmit: async (fd) => {
          const file = fd.get("receipt");
          const body = { date: val(fd, "date"), amount: Number(val(fd, "amount")), category: val(fd, "category"), payee: val(fd, "payee"), method: val(fd, "method"), ref: val(fd, "ref"), note: val(fd, "note") };
          if (file && file.size) body.receiptData = await fileToDataUrl(file);
          const r = await api("ops/expenses", { method: "POST", body });
          toast(r.needsApproval ? "Recorded and sent for approval." : "Expense recorded.");
          render("expenses");
        } });

      case "decide-expense": {
        await busy(t, "…", () => api("ops/expenses/decide", { method: "POST", body: { id, decision: t.dataset.decision } }));
        toast(`Marked ${t.dataset.decision}.`);
        return render("expenses");
      }
      case "decide-approval": {
        await busy(t, "…", () => api("ops/approvals", { method: "POST", body: { id, decision: t.dataset.decision } }));
        toast(`Marked ${t.dataset.decision}.`);
        return render("approvals");
      }

      case "new-entry": {
        const accounts = S.data.accountsList || [];
        const options = accounts.map((a) => `<option value="${esc(a.code)}">${esc(a.code)} ${esc(a.name)}</option>`).join("");
        return openDialog("New bookkeeping entry", `
          <div class="row2"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}"></div>
          <div class="field"><label>Reference</label><input name="ref"></div></div>
          <div class="field"><label>What it is for</label><input name="memo" required></div>
          <div class="row2"><div class="field"><label>Debit account (money in / cost)</label><select name="debitAcc">${options}</select></div>
          <div class="field"><label>Amount (shillings)</label><input name="amount" type="number" min="1" required></div></div>
          <div class="field"><label>Credit account (where it came from)</label><select name="creditAcc">${options}</select></div>
          <p class="hint">One side gains, the other gives. The two sides must match, which is why there is one amount.</p>`,
          { submit: "Post entry", onSubmit: async (fd) => {
            const amount = Number(val(fd, "amount"));
            await api("ops/accounts", { method: "POST", body: { date: val(fd, "date"), memo: val(fd, "memo"), ref: val(fd, "ref"),
              lines: [{ account: val(fd, "debitAcc"), debit: amount }, { account: val(fd, "creditAcc"), credit: amount }] } });
            toast("Entry posted."); render("accounts");
          } });
      }

      case "new-employee": return openDialog("Add an employee", `
        <div class="row2"><div class="field"><label>Full name</label><input name="name" required></div>
        <div class="field"><label>Email (their username)</label><input name="email" type="email" required></div></div>
        <div class="row2"><div class="field"><label>Job title</label><input name="title" placeholder="Senior loctician"></div>
        <div class="field"><label>Phone</label><input name="phone" type="tel"></div></div>
        <div class="row2"><div class="field"><label>Department</label><select name="department">${Object.entries(S.departments).map(([k, v]) => `<option value="${esc(k)}">${esc(v.name)}</option>`).join("")}</select></div>
        <div class="field"><label>Role</label><select name="role"><option value="staff">Team member</option><option value="head">Department head</option></select></div></div>
        ${can("staff.pay") ? `<div class="field"><label>Pay rate (shillings)</label><input name="payRate" type="number" min="0"></div>` : ""}`,
        { submit: "Create account", onSubmit: async (fd) => {
          const r = await api("staff/employees", { method: "POST", body: { name: val(fd, "name"), email: val(fd, "email"), title: val(fd, "title"), phone: val(fd, "phone"), department: val(fd, "department"), role: val(fd, "role"), payRate: Number(val(fd, "payRate") || 0) } });
          render("staff");
          setTimeout(() => openDialog("Account created", `<div class="secret-box"><span class="lbl">One-time password</span><div class="secret">${esc(r.temporaryPassword)}</div><span class="hint">${esc(r.note)}</span></div>`, {}), 300);
        } });

      case "edit-employee": {
        const e2 = (S.data.employees || []).find((x) => x.id === id);
        if (!e2) return;
        return openDialog(`Edit ${e2.name}`, `
          <div class="row2"><div class="field"><label>Name</label><input name="name" value="${esc(e2.name)}"></div>
          <div class="field"><label>Job title</label><input name="title" value="${esc(e2.title || "")}"></div></div>
          <div class="row2"><div class="field"><label>Department</label><select name="department">${Object.entries(S.departments).map(([k, v]) => `<option value="${esc(k)}" ${k === e2.department ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></div>
          <div class="field"><label>Role</label><select name="role">${["staff", "head", "owner"].map((r) => `<option value="${r}" ${r === e2.role ? "selected" : ""}>${r}</option>`).join("")}</select></div></div>
          <div class="row2"><div class="field"><label>Phone</label><input name="phone" value="${esc(e2.phone || "")}"></div>
          <div class="field"><label>Status</label><select name="status"><option value="active" ${e2.status === "active" ? "selected" : ""}>Active</option><option value="suspended" ${e2.status === "suspended" ? "selected" : ""}>Suspended</option></select></div></div>
          ${can("staff.pay") ? `<div class="field"><label>Pay rate (shillings)</label><input name="payRate" type="number" value="${shillings(e2.pay_rate_cents)}"></div>` : ""}`,
          { submit: "Save", onSubmit: async (fd) => {
            await api("staff/employees", { method: "PUT", body: { id, name: val(fd, "name"), title: val(fd, "title"), department: val(fd, "department"), role: val(fd, "role"), phone: val(fd, "phone"), status: val(fd, "status"), payRate: val(fd, "payRate") ? Number(val(fd, "payRate")) : undefined } });
            toast("Saved."); render("staff");
          } });
      }

      case "reset-employee": {
        const r = await busy(t, "…", () => api("staff/employees/password", { method: "POST", body: { id } }));
        render("staff");
        return openDialog("New one-time password", `<div class="secret-box"><div class="secret">${esc(r.temporaryPassword)}</div><span class="hint">${esc(r.note)}</span></div>`, {});
      }

      case "new-task": return openDialog("Add a task", `
        <div class="field"><label>What needs doing</label><input name="title" required></div>
        <div class="field"><label>Details</label><textarea name="detail"></textarea></div>
        <div class="row2"><div class="field"><label>Department</label><select name="department">${Object.entries(S.departments).map(([k, v]) => `<option value="${esc(k)}" ${k === S.me.department ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></div>
        <div class="field"><label>Due</label><input name="dueOn" type="date"></div></div>
        ${can("tasks.assign") ? `<div class="field"><label>Who does it</label><select name="assignee"><option value="">Anyone in the department</option>${(S.data.people || []).map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></div>` : ""}`,
        { submit: "Add task", onSubmit: async (fd) => {
          await api("ops/tasks", { method: "POST", body: { title: val(fd, "title"), detail: val(fd, "detail"), department: val(fd, "department"), dueOn: val(fd, "dueOn"), assignee: val(fd, "assignee") } });
          toast("Task added."); render("tasks");
        } });

      case "edit-offer": case "new-offer": {
        const o = (S.data.offers || []).find((x) => x.id === id) || {};
        return openDialog(id ? "Edit offer" : "New offer", `
          <div class="field"><label>Title</label><input name="title" value="${esc(o.title || "")}" required></div>
          <div class="field"><label>Details</label><textarea name="detail">${esc(o.detail || "")}</textarea></div>
          <div class="row2"><div class="field"><label>Discount %</label><input name="discountPct" type="number" min="0" max="100" value="${o.discount_pct ?? 10}"></div>
          <div class="field"><label>Code</label><input name="code" value="${esc(o.code || "")}" placeholder="LOCS10"></div></div>
          <div class="row2"><div class="field"><label>Starts</label><input name="startsOn" type="date" value="${esc(o.starts_on || "")}"></div>
          <div class="field"><label>Ends</label><input name="endsOn" type="date" value="${esc(o.ends_on || "")}"></div></div>
          <div class="field"><label>Who sees it</label><select name="audience">${["all", "returning", "new"].map((a) => `<option value="${a}" ${a === o.audience ? "selected" : ""}>${a}</option>`).join("")}</select></div>`,
          { submit: "Save offer", onSubmit: async (fd) => {
            await api("ops/offers", { method: "PUT", body: { id, title: val(fd, "title"), detail: val(fd, "detail"), discountPct: Number(val(fd, "discountPct")), code: val(fd, "code"), startsOn: val(fd, "startsOn"), endsOn: val(fd, "endsOn"), audience: val(fd, "audience") } });
            toast("Offer saved."); render("offers");
          } });
      }

      case "new-document": case "edit-document": {
        const d = (S.data.documents || []).find((x) => x.id === id) || {};
        return openDialog(id ? "Edit document" : "Add a document", `
          <div class="field"><label>Title</label><input name="title" value="${esc(d.title || "")}" required></div>
          ${id ? "" : `<div class="field"><label>Shelf</label><select name="department"><option value="company">Company (everyone)</option>${Object.entries(S.departments).map(([k, v]) => `<option value="${esc(k)}" ${k === S.me.department ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select></div>`}
          <div class="field"><label>Written contents</label><textarea name="body" style="min-height:160px">${esc(d.body || "")}</textarea></div>
          ${id ? "" : `<div class="field"><label>Or upload a file</label><input name="file" type="file" accept="image/*,application/pdf,.docx,.xlsx,.csv,.txt"></div>
          <div class="field"><label>Or a link</label><input name="url" placeholder="https://"></div>
          ${can("documents.owner") ? `<label class="hint"><input type="checkbox" name="ownerOnly"> Owner only (hidden from all staff)</label>` : ""}`}`,
          { submit: "Save", onSubmit: async (fd) => {
            if (id) await api("ops/documents", { method: "PUT", body: { id, title: val(fd, "title"), body: val(fd, "body") } });
            else {
              const file = fd.get("file");
              const body = { title: val(fd, "title"), department: val(fd, "department"), body: val(fd, "body"), url: val(fd, "url"), ownerOnly: fd.get("ownerOnly") === "on" };
              if (file && file.size) body.fileData = await fileToDataUrl(file);
              await api("ops/documents", { method: "POST", body });
            }
            toast("Saved."); render("documents");
          } });
      }

      case "edit-client": {
        const c = (S.data.clients || []).find((x) => x.id === id) || {};
        return openDialog(`Edit ${c.name || "client"}`, `
          <div class="row2"><div class="field"><label>Name</label><input name="name" value="${esc(c.name || "")}"></div>
          <div class="field"><label>Phone</label><input name="phone" value="${esc(c.phone || "")}"></div></div>
          <div class="field"><label>Notes about their locs</label><textarea name="notes">${esc(c.notes || "")}</textarea></div>`,
          { submit: "Save", onSubmit: async (fd) => {
            await api("ops/clients", { method: "PUT", body: { id, name: val(fd, "name"), phone: val(fd, "phone"), notes: val(fd, "notes") } });
            toast("Saved."); render("clients");
          } });
      }

      case "add-photo": {
        const cat = S.data.catalog || await api("ops/catalog");
        S.data.catalog = cat;
        return openDialog("Add a photo of our work", `
          <div class="notice"><strong>Ask the client first.</strong>
            <span class="hint">A photo of someone's hair only goes on the website if they have said yes. Write down how they agreed, so there is a record.</span></div>
          <div class="field"><label>Photo</label><input name="photo" type="file" accept="image/*" required></div>
          <div class="field"><label>Short title</label><input name="title" placeholder="Microlocs, shoulder length" required></div>
          <div class="row2">
            <div class="field"><label>Service</label><select name="serviceId"><option value="">Not linked to a service</option>${cat.services.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select></div>
            <div class="field"><label>Client name (staff only)</label><input name="clientName" placeholder="Never shown on the website"></div>
          </div>
          <div class="field"><label>Caption for the website</label><textarea name="caption" placeholder="Four hours, finished with gold cuffs"></textarea></div>
          <label class="row"><input type="checkbox" name="consent"> <span>The client agreed we can show this photo</span></label>
          <div class="field"><label>How they agreed</label><input name="consentNote" placeholder="Said yes in the salon, 12 Nov"></div>
          <label class="row"><input type="checkbox" name="published" checked> <span>Put it on the website now (needs consent)</span></label>
          <label class="row"><input type="checkbox" name="featured"> <span>Show it first</span></label>`,
          { submit: "Add photo", onSubmit: async (fd) => {
            const file = fd.get("photo");
            if (!file || !file.size) throw new Error("Choose a photo first.");
            await api("ops/gallery", { method: "POST", body: {
              imgData: await fileToDataUrl(file, 1400), title: val(fd, "title"), serviceId: val(fd, "serviceId"),
              clientName: val(fd, "clientName"), caption: val(fd, "caption"),
              consent: fd.get("consent") === "on", consentNote: val(fd, "consentNote"),
              published: fd.get("published") === "on", featured: fd.get("featured") === "on",
            } });
            toast("Photo added."); render("gallery");
          } });
      }

      case "edit-photo": {
        const photo = (S.data.photos || []).find((x) => x.id === id);
        if (!photo) return;
        return openDialog("Edit photo", `
          <img src="${esc(photo.img)}" alt="" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px">
          <div class="field"><label>Short title</label><input name="title" value="${esc(photo.title)}"></div>
          <div class="field"><label>Caption for the website</label><textarea name="caption">${esc(photo.caption || "")}</textarea></div>
          <div class="field"><label>Client name (staff only)</label><input name="clientName" value="${esc(photo.client_name || "")}"></div>
          <label class="row"><input type="checkbox" name="consent" ${photo.consent ? "checked" : ""}> <span>The client agreed we can show this photo</span></label>
          <div class="field"><label>How they agreed</label><input name="consentNote" value="${esc(photo.consent_note || "")}"></div>
          <label class="row"><input type="checkbox" name="published" ${photo.published ? "checked" : ""}> <span>On the website</span></label>
          <label class="row"><input type="checkbox" name="featured" ${photo.featured ? "checked" : ""}> <span>Show it first</span></label>`,
          { submit: "Save", onSubmit: async (fd) => {
            await api("ops/gallery", { method: "PUT", body: {
              id, title: val(fd, "title"), caption: val(fd, "caption"), clientName: val(fd, "clientName"),
              consent: fd.get("consent") === "on", consentNote: val(fd, "consentNote"),
              published: fd.get("published") === "on", featured: fd.get("featured") === "on",
            } });
            toast("Saved."); render("gallery");
          } });
      }

      case "toggle-photo": {
        await busy(t, "Saving...", () => api("ops/gallery", { method: "PUT", body: { id, published: t.dataset.pub === "1" } }));
        toast(t.dataset.pub === "1" ? "Now on the website." : "Taken off the website.");
        return render("gallery");
      }

      case "delete-photo": {
        if (!confirm("Delete this photo for good? It disappears from the website straight away.")) return;
        await api("ops/gallery", { method: "DELETE", body: { id } });
        toast("Photo deleted.");
        return render("gallery");
      }

      case "open-agent": {
        const a = (S.data.agents || []).find((x) => x.id === id);
        if (!a) return;
        openDialog(a.name, `
          <p class="hint">${esc(a.title)} · ${esc(a.brief.slice(0, 180))}…</p>
          <div class="chips">${a.starters.map((s) => `<button type="button" class="chip" data-starter="${esc(s)}">${esc(s)}</button>`).join("")}</div>
          <div class="field"><label for="q">Your question</label><textarea name="question" id="q" style="min-height:90px" required></textarea></div>
          <div id="answer" hidden><span class="lbl">Answer</span><div class="answer" id="answerText"></div></div>`,
          { submit: "Ask", wide: true, onSubmit: async (fd) => {
            const r = await api("agents/ask", { method: "POST", body: { agentId: id, question: val(fd, "question") } });
            $("#answer").hidden = false;
            $("#answerText").textContent = r.answer;
            throw new Error(""); // keep the dialog open to show the answer
          } });
        $("#dlgErr").hidden = true;
        return;
      }
    }
  } catch (err) { if (err.message) toast(err.message); }
});

// starter questions inside the agent dialog
document.addEventListener("click", (e) => {
  const chip = e.target.closest("[data-starter]");
  if (chip) { const q = $("#q"); if (q) { q.value = chip.dataset.starter; q.focus(); } }
});

document.addEventListener("change", async (e) => {
  const t = e.target;
  try {
    if (t.id === "navMobile") return go(t.value);
    if (t.dataset.status === "booking") { await api("ops/bookings", { method: "PATCH", body: { id: t.dataset.id, status: t.value } }); toast(`${t.dataset.id} marked ${t.value}.`); return render("bookings"); }
    if (t.dataset.status === "order") { await api("ops/orders", { method: "PATCH", body: { id: t.dataset.id, status: t.value } }); toast(`${t.dataset.id} marked ${t.value}.`); return render("orders"); }
    if (t.dataset.status === "task") { await api("ops/tasks", { method: "PATCH", body: { id: t.dataset.id, status: t.value } }); return toast(`Task ${t.value}.`); }
    if (t.dataset.assign) { await api("ops/bookings", { method: "PATCH", body: { id: t.dataset.assign, assignedTo: t.value } }); return toast("Assigned."); }
  } catch (err) { toast(err.message); render(S.section); }
});

let searchT;
document.addEventListener("input", (e) => {
  if (e.target.id === "cq") {
    clearTimeout(searchT);
    searchT = setTimeout(() => { S.data.clientQuery = e.target.value; render("clients"); }, 400);
  }
});

document.addEventListener("submit", async (e) => {
  if (e.target.id !== "settingsForm") return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {};
  for (const [k, v] of fd.entries()) body[k] = v;
  try {
    await busy(e.submitter, "Saving…", () => api("ops/settings", { method: "PUT", body }));
    toast("Settings saved.");
  } catch (err) { toast(err.message); }
});

window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h && h !== S.section) go(h);
});

boot().catch((e) => { $("#main").innerHTML = `<div class="panel"><h3>Could not load the hub</h3><p class="err">${esc(e.message)}</p></div>`; });
})();
</script>
</body>
</html>
