<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Twins Locs Arena">
  <title>Twins Locs Arena</title>
  <defs>
    <style>
      .head{fill:#F8E8C8}
      .loc{fill:#C07F52}
      .bead{fill:#E5A62B}
      .word{font-family:"Young Serif",Georgia,"Times New Roman",serif;fill:#F8E8C8}
      .tag{font-family:"Nunito","Trebuchet MS",sans-serif;font-style:italic;font-weight:900;fill:#F8E8C8}
    </style>

    <!-- one hanging loc with a gold cuff -->
    <g id="loc">
      <rect x="-9" y="0" width="18" height="118" rx="9" class="loc"/>
      <rect x="-11" y="84" width="22" height="12" rx="4" class="bead"/>
    </g>

    <!-- a profile silhouette, facing right -->
    <g id="head">
      <!-- the head, with the back edge scalloped into locs -->
      <path class="head" d="M104 28
        c46 0 80 34 84 80
        c2 22-1 36 7 50
        c6 11 17 22 17 31
        c0 9-11 12-18 13
        c-6 1-7 3-7 10
        c0 12 2 21-6 28
        c-8 7-21 8-35 6
        l-3 36
        c-2 20-18 34-40 34
        c-16 0-30-4-42-12
        c-10-7-16-16-16-26
        c0-14 6-24 6-40
        V84
        c0-30 20-56 53-56 Z"/>
      <!-- the loc mass behind, its outer edge made of loc bumps -->
      <path class="head" d="M86 44c-30 8-52 34-54 68 a26 26 0 0 0 0 26 a26 26 0 0 0 0 26 a26 26 0 0 0 0 26 a26 26 0 0 0 0 26 a26 26 0 0 0 0 26 a26 26 0 0 0 0 26 a26 26 0 0 0 0 26 a26 26 0 0 0 0 26 a26 26 0 0 0 0 26 c0 18-4 30-4 30h66V44Z"/>
      <!-- two locs falling past the jaw, each finished with a gold cuff -->
      <g class="loc">
        <rect x="74" y="196" width="17" height="104" rx="8.5"/>
        <rect x="72" y="268" width="21" height="12" rx="4" class="bead"/>
        <rect x="104" y="214" width="17" height="86" rx="8.5"/>
        <rect x="102" y="276" width="21" height="12" rx="4" class="bead"/>
      </g>
    </g>
  </defs>
  <rect width="512" height="512" rx="96" fill="#204028"/>
  <g transform="translate(26,96) scale(0.62)"><use href="#head"/></g>
  <g transform="translate(486,96) scale(-0.62,0.62)"><use href="#head"/></g>
</svg>
